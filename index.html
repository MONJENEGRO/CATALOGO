<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monje Negro - Catálogo</title>
    <style>
        @font-face { font-family: 'AM Tripoli'; src: url('AMTripoli-Regular.ttf'); font-display: swap; }
        @font-face { font-family: 'Monley'; src: url('MonleyRegular.Ttf'); font-display: swap; }

        :root { --rojo: #ed1c24; --negro: #0a0a0a; --gris: #1a1a1a; --verde-wpp: #25d366; }
        body { background-color: var(--negro); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 100px; }
        
        header { background: black; padding: 25px 20px; text-align: center; border-bottom: 3px solid var(--rojo); }
        .brand { color: var(--rojo); font-family: 'AM Tripoli', sans-serif; font-size: 3.2em; margin: 0; text-transform: uppercase; }
        .sub { color: white; font-family: 'Monley', cursive; font-size: 1.8em; margin-top: -5px; display: block; }

        .container { padding: 15px; max-width: 1000px; margin: auto; }

        /* Buscador y Filtros */
        .filtros-area { background: #000; padding: 15px 0; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
        #buscador { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
        #buscador:focus { border-color: var(--rojo); box-shadow: 0 0 8px rgba(237, 28, 36, 0.3); }
        
        /* Controles con Flechas */
        .scroll-wrapper { display: flex; align-items: center; width: 100%; margin-bottom: 5px; }
        .scroll-btn { background: transparent; border: none; color: var(--rojo); font-size: 1.5em; cursor: pointer; padding: 0 5px; transition: 0.2s; user-select: none; }
        .scroll-btn:active { transform: scale(0.8); }
        
        .filtro-grupo { flex-grow: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; margin: 0 5px; }
        .filtro-grupo::-webkit-scrollbar { display: none; }
        .btn-filtro { background: #222; color: #aaa; border: 1px solid #333; padding: 8px 16px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-size: 0.85em; transition: 0.3s; }
        .btn-filtro.active { background: var(--rojo); color: white; border-color: var(--rojo); font-weight: bold; }

        /* Grid de Productos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
        .producto { background: var(--gris); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; }
        .producto img { width: 100%; height: 160px; object-fit: contain; margin-bottom: 10px; }
        .nombre { font-weight: bold; font-size: 0.9em; height: 35px; overflow: hidden; display: block; margin-bottom: 5px; line-height: 1.2; }
        .precio { color: #fff; font-size: 1.1em; font-weight: bold; display: block; margin-bottom: 10px; }

        /* Controles de Cantidad en Catálogo */
        .selector-cantidad { display: flex; align-items: center; justify-content: center; background: #000; border-radius: 6px; border: 1px solid #333; margin-bottom: 8px; }
        .btn-qty { background: #222; color: white; border: none; padding: 8px 12px; cursor: pointer; width: 40px; font-weight: bold; }
        .input-qty { background: transparent; color: white; border: none; width: 40px; text-align: center; font-weight: bold; outline: none; }
        .btn-add { background: var(--rojo); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; font-size: 0.7em; }

        /* Barra Flotante */
        #cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--verde-wpp); color: white; padding: 15px; text-align: center; font-weight: bold; border-radius: 15px; cursor: pointer; display: none; z-index: 99; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }

        /* MODAL DEL CARRITO */
        #cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; width: 100%; max-width: 500px; border-radius: 15px; padding: 20px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--rojo); position: relative; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 12px 0; font-size: 0.9em; gap: 10px; }
        .cart-item-info { flex-grow: 1; }
        
        /* Controles de Cantidad en Carrito */
        .cart-qty-controls { display: flex; align-items: center; background: #000; border: 1px solid #333; border-radius: 4px; }
        .cart-qty-btn { background: #222; color: white; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .cart-qty-val { width: 25px; text-align: center; font-weight: bold; color: white; font-size: 0.9em; }
        
        .cart-item-total { font-weight: bold; min-width: 70px; text-align: right; }
        .cart-remove { color: var(--rojo); background: none; border: none; font-size: 1.2em; cursor: pointer; font-weight: bold; padding: 0 5px; }
        
        .modal-footer { margin-top: 20px; text-align: center; }
        .btn-send { background: var(--verde-wpp); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 1em; cursor: pointer; }
        .btn-close { color: #aaa; background: none; border: none; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 0.9em; }
    </style>
</head>
<body>

<header>
    <h1 class="brand">MONJE NEGRO</h1>
    <span class="sub">botilleria</span>
</header>

<div class="filtros-area">
    <div class="container">
        <input type="text" id="buscador" placeholder="Buscar bebidas..." oninput="renderProducts()">
        
        <div class="scroll-wrapper">
            <button class="scroll-btn" onclick="scrollMenu('filtros-tipo', -200)">&#10094;</button>
            <div id="filtros-tipo" class="filtro-grupo"></div>
            <button class="scroll-btn" onclick="scrollMenu('filtros-tipo', 200)">&#10095;</button>
        </div>
        
        <div id="seccion-cepas" style="display:none; margin-top: 10px;">
            <div class="scroll-wrapper">
                <button class="scroll-btn" onclick="scrollMenu('filtros-cepa', -200)">&#10094;</button>
                <div id="filtros-cepa" class="filtro-grupo"></div>
                <button class="scroll-btn" onclick="scrollMenu('filtros-cepa', 200)">&#10095;</button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div id="loading" style="text-align: center; padding-top: 50px; color: var(--rojo);">Preparando la cava...</div>
    <div id="catalogo-grid" class="grid"></div>
</div>

<div id="cart-bar" onclick="toggleModal(true)">
    🛒 VER MI PEDIDO (<span id="count">0</span>)
</div>

<div id="cart-modal">
    <div class="modal-content">
        <h2 style="color:var(--rojo); margin-top:0; border-bottom: 1px solid var(--rojo); padding-bottom: 10px;">Resumen del Pedido</h2>
        <div id="cart-list"></div>
        <div class="modal-footer">
            <div id="total-details" style="text-align: right; margin-bottom: 15px; line-height: 1.4;"></div>
            <button class="btn-send" onclick="sendWpp()">ENVIAR PEDIDO POR WHATSAPP</button>
            <button class="btn-close" onclick="toggleModal(false)">Añadir más productos</button>
        </div>
    </div>
</div>

<script>
    const EXCEL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRh5hj_V9tKP0pltPLCB8WMDw2f6L0DkKUWx0adnDXkWPVCqsqR-hOMFLPBKq6DIceIM2o7Pz-Z0COM/pub?output=csv';
    const WHATSAPP_NUMBER = "5493512345678"; 

    // LISTA DE CATEGORÍAS PRINCIPALES
    const TIPOS = ["Todos", "OFERTAS", "PROMOS", "VINOS TINTOS", "VINOS BLANCOS", "VINOS ROSADOS", "APERITIVOS", "DESTILADOS", "COMIDA", "WHISKY", "ESPUMANTES", "CERVEZAS", "LICOR", "SIDRA", "ENERGIZANTES", "GASEOSAS", "JUGOS", "SODA", "HIELO", "TABACO", "HABANO", "ENCENDEDORES", "VASOS", "SACACORCHOS", "REGALERIA"];
    
    // LISTA DE SUBCATEGORÍAS
    const CEPAS = {
        "APERITIVOS": ["Todos", "FERNET", "VERMUT"],
        "CERVEZAS": ["Todos", "BOTELLA", "LATA", "LATON", "PORRON"],
        "COMIDA": ["Todos", "ALFAJORES", "CONITOS", "MANI", "NUEZ CONFITADA", "QUESOS", "SALAMES", "SNACKS"],
        "DESTILADOS": ["Todos", "GIN", "RON", "VODKA"],
        "ESPUMANTES": ["Todos", "APERITIEF", "BLANC DE BLANCAS", "BLANC DE NOIRS", "BRUT", "BRUT NATURE", "BRUT ROSE", "DELICE", "DEMI SEC", "DULCE", "DULCE NATURAL", "EXTRA BRUT", "NARANJO", "ROSE", "ROSE EXTRA BRUT", "SPRITZ", "ZERO"],
        "TABACO": ["Todos", "CEDAS", "FILTROS"],
        "VINOS BLANCOS": ["Todos", "CHARDONNAY", "CHENIN DULCE", "DULCE", "SAUVIGNON BLANC", "SEMILLON", "TORRONTES", "TRIFECTA", "VIOGNIER"],
        "VINOS TINTOS": ["Todos", "ANCELLOTTA", "BLEND", "BONARDA", "CABERNET FRANC", "CABERNET FRANC - MALBEC", "CABERNET SAUVIGNON", "GRAN RESERVA MALBEC", "MALBEC", "MALBEC - MALBEC", "MALBEC ORGANICO", "MALBEC-CABERNET", "MERLOT", "PINOT NOIR", "SYRAH", "TANNAT"]
    };
    
    // CATEGORÍAS QUE CUENTAN PARA EL PRECIO MAYORISTA (al juntar 6+ unidades)
    const CATEGORIAS_PROMO = ["VINOS TINTOS", "VINOS BLANCOS", "VINOS ROSADOS", "ESPUMANTES"];
    // A partir de cuántos vinos se activa el precio mayorista y qué margen se aplica sobre el costo
    const VINOS_PARA_MAYORISTA = 6;
    const MARGEN_MAYORISTA = 1.25; // costo + 25%

    let allProducts = [];
    let cart = [];
    let fTipo = 'Todos';
    let fCepa = 'Todos'; 

    const normalizar = (texto) => {
        if (!texto) return "";
        return texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    };

    // Convierte un precio en texto (ej. "5.000" o "5,5") a n\u00famero
    const parseNum = (v) => parseFloat((v || '').toString().replace(/\./g, '').replace(',', '.')) || 0;

    // True si el producto es vino/espumante (cuenta para el precio mayorista)
    const esVino = (tipo) => CATEGORIAS_PROMO.some(cat => normalizar(cat) === normalizar(tipo));

    // Precio unitario efectivo. Con 6+ vinos, cada vino pasa a precio mayorista (costo + 25%).
    // Si el vino no tiene costo cargado, mantiene su precio de lista (nunca queda en 0).
    function precioUnitario(item, mayorista) {
        const regular = parseNum(item.p);
        if (mayorista && esVino(item.t)) {
            const costo = parseNum(item.c);
            if (costo > 0) {
                const may = Math.round(costo * MARGEN_MAYORISTA);
                // El mayorista nunca puede ser mayor al precio de lista
                return regular > 0 ? Math.min(regular, may) : may;
            }
        }
        return regular;
    }

    // Calcula el resumen del carrito una sola vez (lo usan el modal y el env\u00edo por WhatsApp)
    function calcularResumen() {
        const itemsVino = cart.reduce((acc, i) => acc + (esVino(i.t) ? i.q : 0), 0);
        const mayorista = itemsVino >= VINOS_PARA_MAYORISTA;
        let total = 0;
        const lineas = cart.map(item => {
            const regular = parseNum(item.p);
            const pu = precioUnitario(item, mayorista);
            const lineTotal = pu * item.q;
            total += lineTotal;
            return { item, regular, pu, lineTotal, esVinoItem: esVino(item.t) };
        });
        return { itemsVino, mayorista, total, lineas };
    }

    // Función para deslizar el menú con las flechitas
    function scrollMenu(id, px) {
        document.getElementById(id).scrollBy({ left: px, behavior: 'smooth' });
    }

    async function fetchProducts() {
        try {
            const res = await fetch(EXCEL_URL + '&t=' + new Date().getTime());
            const text = await res.text();
            const rows = text.split('\n').slice(1);
            
            allProducts = rows.map(r => {
                const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (c.length < 5) return null;
                const clean = (v) => v ? v.replace(/"/g, '').trim() : '';
                
                return { 
                    name: clean(c[0]), 
                    price: clean(c[1]), 
                    img: clean(c[3]) || 'https://via.placeholder.com/200', 
                    tipo: clean(c[4]),
                    cepa: clean(c[5]),
                    stock: clean(c[6]), // LEYENDO LA COLUMNA G (Stock)
                    costo: clean(c[7]) // LEYENDO LA COLUMNA H (Costo - para precio mayorista, NO se muestra al cliente)
                };
            }).filter(p => p && p.name !== "" && p.stock !== "0"); // OCULTA SI EL STOCK ES "0"

            renderFiltros();
            renderProducts();
            document.getElementById('loading').style.display = 'none';
        } catch (e) { 
            console.error(e);
            document.getElementById('loading').innerText = "Error al cargar los productos. Por favor, recargá la página.";
        }
    }

    function renderFiltros() {
        document.getElementById('filtros-tipo').innerHTML = TIPOS.map(t => `<button class="btn-filtro ${t===fTipo?'active':''}" onclick="setFiltro('tipo', '${t}')">${t}</button>`).join('');
        
        const seccionCepas = document.getElementById('seccion-cepas');
        if (CEPAS[fTipo]) {
            seccionCepas.style.display = "block";
            document.getElementById('filtros-cepa').innerHTML = CEPAS[fTipo].map(c => 
                `<button class="btn-filtro ${c===fCepa?'active':''}" onclick="setFiltro('cepa', '${c}')">${c}</button>`).join('');
        } else {
            seccionCepas.style.display = "none";
        }
    }

    function setFiltro(cat, val) { 
        if (cat === 'tipo') {
            fTipo = val;
            fCepa = 'Todos'; 
        } else {
            fCepa = val;
        }
        renderFiltros(); 
        renderProducts(); 
    }

    function updateQty(btn, delta) {
        const input = btn.parentElement.querySelector('input');
        let val = parseInt(input.value) + delta;
        if (val < 1) val = 1;
        input.value = val;
    }

    function renderProducts() {
        const grid = document.getElementById('catalogo-grid');
        const search = normalizar(document.getElementById('buscador').value);

        const filtered = allProducts.filter(p => {
            const mTipo = fTipo === 'Todos' || normalizar(p.tipo) === normalizar(fTipo);
            const mCepa = fCepa === 'Todos' || normalizar(p.cepa) === normalizar(fCepa);
            const mSearch = search === '' || normalizar(p.name).includes(search);
            return mTipo && mCepa && mSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888;">No se encontraron productos para esta categoría.<br><small>Verificá que en la Columna E diga exactamente "${fTipo}"</small></p>`;
            return;
        }

        // Se arma todo el HTML de una sola vez y se inserta en un unico paso (mucho mas rapido en el celu).
        // loading="lazy" hace que cada foto se baje recien cuando esta por verse en pantalla.
        grid.innerHTML = filtered.map((p, index) => `
                <div class="producto">
                    <img src="${p.img}" loading="lazy" decoding="async" alt="${p.name}">
                    <span class="nombre">${p.name}</span>
                    <span class="precio">$${p.price}</span>
                    <div class="selector-cantidad">
                        <button class="btn-qty" onclick="updateQty(this, -1)">-</button>
                        <input type="number" class="input-qty" value="1" id="qty-${index}" readonly>
                        <button class="btn-qty" onclick="updateQty(this, 1)">+</button>
                    </div>
                    <button class="btn-add" onclick="addItem('${p.name}', '${p.price}', '${p.tipo}', '${p.costo}', 'qty-${index}')">Añadir</button>
                </div>`).join('');
    }

    function addItem(n, p, t, c, qtyId) {
        const qty = parseInt(document.getElementById(qtyId).value);
        const item = cart.find(i => i.n === n);
        if (item) item.q += qty; else cart.push({n, p, t, c, q: qty});

        document.getElementById(qtyId).value = 1;
        updateCartUI();
    }

    function updateCartItemQty(index, delta) {
        cart[index].q += delta;
        if (cart[index].q < 1) {
            cart.splice(index, 1); 
        }
        updateCartUI();
        if (cart.length === 0) {
            toggleModal(false);
        } else {
            renderCartModal();
        }
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCartUI();
        if (cart.length === 0) toggleModal(false); else renderCartModal();
    }

    function toggleModal(show) {
        document.getElementById('cart-modal').style.display = show ? 'flex' : 'none';
        if(show) renderCartModal();
    }

    function updateCartUI() {
        const count = cart.reduce((acc, i) => acc + i.q, 0);
        document.getElementById('cart-bar').style.display = count > 0 ? 'block' : 'none';
        document.getElementById('count').innerText = count;
    }

    function renderCartModal() {
        const list = document.getElementById('cart-list');
        const details = document.getElementById('total-details');
        list.innerHTML = '';

        const { itemsVino, mayorista, total, lineas } = calcularResumen();

        lineas.forEach((ln, index) => {
            const { item, regular, pu, lineTotal, esVinoItem } = ln;
            const aplicado = mayorista && esVinoItem && pu < regular;
            const precioCu = aplicado
                ? `<s style="color:#777;">$${item.p}</s> <span style="color:#d4af37;">$${pu.toLocaleString('es-AR')}</span> c/u`
                : `$${item.p} c/u`;

            list.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <strong>${item.n}</strong><br>
                        <small>${precioCu}</small>
                    </div>

                    <div class="cart-qty-controls">
                        <button class="cart-qty-btn" onclick="updateCartItemQty(${index}, -1)">-</button>
                        <span class="cart-qty-val">${item.q}</span>
                        <button class="cart-qty-btn" onclick="updateCartItemQty(${index}, 1)">+</button>
                    </div>

                    <span class="cart-item-total">$${lineTotal.toLocaleString('es-AR')}</span>
                    <button class="cart-remove" onclick="removeItem(${index})">✕</button>
                </div>`;
        });

        let htmlDetails = '';
        if (mayorista) {
            const totalRegular = lineas.reduce((a, ln) => a + ln.regular * ln.item.q, 0);
            const ahorro = totalRegular - total;
            htmlDetails += `<div style="color:#d4af37; font-weight:bold;">🍷 ¡PRECIO MAYORISTA ACTIVADO!</div>`;
            if (ahorro > 0) htmlDetails += `<div style="color:#d4af37; font-size:0.9em;">Ahorrás $${ahorro.toLocaleString('es-AR')}</div>`;
            htmlDetails += `<div style="font-size:1.3em; font-weight:bold; margin-top:5px; color:#fff;">TOTAL: $${total.toLocaleString('es-AR')}</div>`;
        } else {
            htmlDetails += `<div style="font-size:1.3em; font-weight:bold; margin-top:5px; color:#fff;">TOTAL: $${total.toLocaleString('es-AR')}</div>`;
            if (itemsVino > 0) {
                const faltan = VINOS_PARA_MAYORISTA - itemsVino;
                htmlDetails += `<small style="color:#888;">Llevás ${itemsVino} vino(s). ¡Sumá ${faltan} más y accedé al PRECIO MAYORISTA! 🍷</small>`;
            }
        }
        details.innerHTML = htmlDetails;
    }

    function sendWpp() {
        const { mayorista, total, lineas } = calcularResumen();
        let msg = "¡Hola Monje Negro! 🍷 Este es mi pedido:%0A%0A";

        lineas.forEach(ln => {
            msg += `• ${ln.item.q}x ${ln.item.n} ($${ln.pu.toLocaleString('es-AR')} c/u)%0A`;
        });

        if (mayorista) {
            msg += `%0A*✅ PRECIO MAYORISTA APLICADO (6+ vinos)*`;
        }
        msg += `%0A*TOTAL FINAL: $${total.toLocaleString('es-AR')}*`;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
    }

    fetchProducts();
</script>
</body>
</html>
